<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moving help calculator | Taskrabbit</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   THEME — change these to match the blog. Light only, because
   the tool sits inside your blog page and should match it.
   ========================================================= */
:root{
  --accent:#0B8457;        /* Taskrabbit-style green: swap for the exact brand hex */
  --accent-dark:#086646;
  --accent-tint:#E7F4EE;
  --ink:#1F2A24;
  --ink-soft:#56635B;
  --paper:#FFFFFF;
  --field:#F4F6F3;
  --line:#D8E0DA;
  --kraft:#C9A574;          /* cardboard colour for the progress boxes */
  --kraft-dark:#A8834F;
  --tape:#E9DCC2;
  --radius-lg:18px;
  --radius-md:12px;
  --font:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent}
body{font-family:var(--font);color:var(--ink);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{max-width:720px;margin:0 auto;padding:24px 20px 28px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg)}

/* ---------- Progress: a row of boxes that get packed ---------- */
.progress{display:flex;gap:8px;align-items:flex-end;margin:0 0 22px}
.box{position:relative;flex:1;max-width:44px;height:30px;border:2px dashed var(--line);border-radius:4px;transition:background-color .25s ease,border-color .25s ease,transform .25s ease}
.box.packed{background:var(--kraft);border:2px solid var(--kraft-dark);transform:translateY(-2px)}
.box.packed::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:8px;margin-left:-4px;background:var(--tape);opacity:.9}
.box.current{border-color:var(--kraft-dark);border-style:solid}
.progress-label{margin-left:auto;font-size:14px;color:var(--ink-soft);white-space:nowrap;padding-left:8px}

/* ---------- Question ---------- */
.q-title{font-size:clamp(22px,4.2vw,28px);line-height:1.2;font-weight:800;letter-spacing:-.01em;margin:0 0 6px;outline:none}
.q-hint{color:var(--ink-soft);margin:0 0 18px}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:58px;padding:14px 16px;background:var(--field);border:2px solid transparent;border-radius:var(--radius-md);cursor:pointer;font-weight:600}
.opt:hover{border-color:var(--line)}
.opt[aria-pressed="true"]{background:var(--accent-tint);border-color:var(--accent)}
.opt .mark{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--ink-soft);display:grid;place-items:center;background:var(--paper)}
.opt.multi .mark{border-radius:6px}
.opt[aria-pressed="true"] .mark{border-color:var(--accent);background:var(--accent)}
.opt[aria-pressed="true"] .mark::after{content:"";width:6px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.opt .sub{display:block;font-weight:400;font-size:14px;color:var(--ink-soft)}

/* ---------- Nav ---------- */
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;min-height:48px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;border:0;cursor:pointer;font-weight:700;text-decoration:none}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-dark)}
.btn-primary:disabled{background:var(--line);color:var(--ink-soft);cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--ink-soft);padding:0 6px}
.btn-ghost:hover{color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ---------- Results ---------- */
.r-intro{color:var(--ink-soft);margin:0 0 14px}
.match{border:2px solid var(--accent);border-radius:var(--radius-lg);padding:22px;margin-bottom:22px}
.match-tag{display:inline-block;font-size:14px;font-weight:700;color:var(--accent-dark);background:var(--accent-tint);padding:3px 10px;border-radius:999px;margin-bottom:10px}
.match h3{font-size:clamp(24px,4.6vw,32px);line-height:1.15;margin:0 0 8px;font-weight:800;letter-spacing:-.01em}
.match p{margin:0 0 16px;max-width:60ch}
.estimates{display:grid;gap:10px;margin:0 0 18px;padding:0;list-style:none}
.est{display:flex;gap:14px;align-items:baseline;padding:12px 14px;background:var(--field);border-radius:var(--radius-md)}
.est strong{font-size:20px;font-weight:800;white-space:nowrap}
.est span{color:var(--ink-soft);font-size:15px}
.addons h4{font-size:18px;margin:0 0 10px}
.addon{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.addon:last-child{border-bottom:1px solid var(--line)}
.addon b{display:block}
.addon small{display:block;color:var(--ink-soft);font-size:14px}
.addon a{flex:none;font-weight:700;color:var(--accent-dark);text-decoration:none;padding:10px 4px}
.addon a:hover{text-decoration:underline}
.notes{margin:18px 0 0;padding:0;list-style:none;font-size:14px;color:var(--ink-soft)}
.notes li{margin-top:6px}
.fine{font-size:13px;color:var(--ink-soft);margin:16px 0 0}

@media (max-width:480px){
  .app{padding:18px 14px 22px;border-radius:14px}
  .options{grid-template-columns:1fr}
  .addon{flex-direction:column;align-items:flex-start;gap:4px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<main class="app" id="app" aria-live="polite"></main>

<script>
/* =========================================================
   CONFIG — everything you'll want to edit lives here.
   ========================================================= */
var CONFIG = {
  defaultMarket: "en-US",
  // Default UTMs; any of these can be overridden from the iframe src,
  // e.g. ?utm_campaign=moving_guide_2026
  utm: { utm_source: "taskrabbit_blog", utm_medium: "embedded_tool", utm_campaign: "moving_calculator" },

  markets: {
    "en-US": {
      base: "https://www.taskrabbit.com",
      // VERIFY every path before launch. Only /services/help-moving is confirmed.
      categories: {
        help_moving:    { name: "Help Moving",                path: "/services/help-moving",                blurb: "Taskers load, carry and unload. You bring the truck." },
        truck_assisted: { name: "Truck-Assisted Help Moving", path: "/services/truck-assisted-help-moving", blurb: "Your Tasker brings the truck and does the heavy lifting." },
        full_service:   { name: "Full Service Help Moving",   path: "/services/full-service-help-moving",   blurb: "Truck, packing, loading and unloading, handled end to end." },
        lift_shift:     { name: "Heavy Lifting",              path: "/services/heavy-lifting",              blurb: "Extra muscle for big, awkward items in or around your home." },
        packing:        { name: "Packing & Unpacking",        path: "/services/packing-services",           blurb: "Boxing up before the move, or settling in after." },
        assembly:       { name: "Furniture Assembly",         path: "/services/furniture-assembly",         blurb: "Beds, desks and shelves taken apart and put back together." },
        mounting:       { name: "TV Mounting",                path: "/services/tv-mounting",                blurb: "TVs, shelves and art up on the walls at your new place." },
        cleaning:       { name: "Move-Out Cleaning",          path: "/services/cleaning",                   blurb: "Leave your old place ready for inspection." },
        junk_removal:   { name: "Junk Removal",               path: "/services/junk-removal",               blurb: "Anything you’re not taking, hauled away." }
      },
      overrides: {}
    },
    "en-GB": {
      base: "https://www.taskrabbit.co.uk",
      categories: {
        help_moving:    { name: "Help Moving",         path: "/services/help-moving",          blurb: "Taskers load, carry and unload. You bring the van." },
        truck_assisted: { name: "Man with a Van",      path: "/services/man-with-a-van",       blurb: "Your Tasker brings the van and does the heavy lifting." },
        full_service:   { name: "House Removals",      path: "/services/house-removals",       blurb: "Van, packing, loading and unloading, handled end to end." },
        lift_shift:     { name: "Heavy Lifting",       path: "/services/heavy-lifting",        blurb: "Extra muscle for big, awkward items in or around your home." },
        packing:        { name: "Packing & Unpacking", path: "/services/packing-services",     blurb: "Boxing up before the move, or settling in after." },
        assembly:       { name: "Furniture Assembly",  path: "/services/furniture-assembly",   blurb: "Beds, wardrobes and shelves taken apart and put back together." },
        mounting:       { name: "TV Mounting",         path: "/services/tv-mounting",          blurb: "TVs, shelves and pictures up on the walls at your new place." },
        cleaning:       { name: "End of Tenancy Cleaning", path: "/services/cleaning",         blurb: "Leave your old place ready for the inspection." },
        junk_removal:   { name: "Rubbish Removal",     path: "/services/rubbish-removal",      blurb: "Anything you’re not taking, taken away." }
      },
      // Override any question/option text: "questionId" or "questionId.optionId"
      overrides: {
        "vehicle": "Do you have a van?",
        "vehicle.own": "Yes, I have a van",
        "vehicle.need": "No, I need one",
        "home_size.studio": "Studio or bedsit",
        "home_size.b1": "1 bedroom flat"
      }
    }
    // To add fr-FR / de-DE: copy the en-GB block, set base to the local domain,
    // and translate category names, blurbs and every question in overrides.
  },

  copy: {
    resultsTitle: "Here’s the help that fits your move",
    resultsIntro: "Based on your answers, start here:",
    bestMatch: "Best match",
    addonsTitle: "You’ll probably also want",
    cta: "Find a Tasker",
    seeTaskers: "Find a Tasker",
    restart: "Start over",
    back: "Back",
    next: "Continue",
    fine: "Estimates are a rough guide. Tasker rates and timings vary, and you’ll agree details with your Tasker before booking.",
    noteSoon: "Moving soon? Many Taskers offer same-day and next-day help.",
    notePiano: "Pianos often need a specialist. Mention it when you book so your Tasker can confirm they’re equipped.",
    noteStairs: "Lots of stairs? Booking an extra Tasker usually speeds things up."
  }
};

/* =========================================================
   QUESTIONS — score adds points to categories; est feeds the
   time estimate. showIf hides a question based on earlier answers.
   ========================================================= */
var QUESTIONS = [
  { id: "move_type", type: "single", title: "What are you moving?",
    options: [
      { id: "home",      label: "My whole home",                 score: { help_moving: 3 } },
      { id: "storage",   label: "Into or out of storage",        score: { help_moving: 3 } },
      { id: "few",       label: "A few big items",               sub: "Like a sofa, bed or dresser", score: { lift_shift: 4, help_moving: 1 } },
      { id: "rearrange", label: "Things around my current home", score: { lift_shift: 6 } }
    ] },
  { id: "home_size", type: "single", title: "How big is the place?", hint: "For storage, pick the closest match to what’s going in or out.",
    showIf: function(a){ return a.move_type === "home" || a.move_type === "storage"; },
    options: [
      { id: "studio", label: "Studio",            est: { hours: 2.5, taskers: 2, pack: 2 } },
      { id: "b1",     label: "1 bedroom",         est: { hours: 3.5, taskers: 2, pack: 3 } },
      { id: "b2",     label: "2 bedrooms",        est: { hours: 5,   taskers: 2, pack: 5 } },
      { id: "b3",     label: "3 bedrooms",        est: { hours: 6.5, taskers: 3, pack: 8 } },
      { id: "b4",     label: "4 or more bedrooms", est: { hours: 8,  taskers: 3, pack: 11 } }
    ] },
  { id: "vehicle", type: "single", title: "Do you have a truck or van?",
    showIf: function(a){ return a.move_type !== "rearrange"; },
    options: [
      { id: "own",  label: "Yes, I have one",                score: { help_moving: 4 } },
      { id: "need", label: "No, I need one",                 score: { truck_assisted: 7 } },
      { id: "full", label: "I want the whole move handled",  sub: "Vehicle, packing and lifting", score: { full_service: 9 } }
    ] },
  { id: "help_with", type: "multi", title: "What else do you need help with?", hint: "Pick all that apply.",
    options: [
      { id: "packing",  label: "Packing or unpacking",              score: { packing: 5 } },
      { id: "assembly", label: "Taking apart or rebuilding furniture", score: { assembly: 5 } },
      { id: "mounting", label: "Mounting a TV or shelves",          score: { mounting: 5 } },
      { id: "cleaning", label: "Cleaning the place I’m leaving",    score: { cleaning: 5 } },
      { id: "junk",     label: "Getting rid of things",             score: { junk_removal: 5 } },
      { id: "none",     label: "Nothing else", exclusive: true }
    ] },
  { id: "access", type: "single", title: "How do you get in and out?", hint: "Think about the harder of the two homes.",
    showIf: function(a){ return a.move_type !== "rearrange"; },
    options: [
      { id: "ground",   label: "Ground floor or driveway", est: { mult: 1 } },
      { id: "elevator", label: "Elevator",                 est: { mult: 1.1 } },
      { id: "stairs1",  label: "1–2 flights of stairs",    est: { mult: 1.2 },  score: { lift_shift: 1 } },
      { id: "stairs3",  label: "3 or more flights",        est: { mult: 1.35 }, score: { lift_shift: 2 } }
    ] },
  { id: "specialty", type: "multi", title: "Anything especially heavy?", hint: "Pick all that apply.",
    options: [
      { id: "appliance", label: "Washer, dryer or fridge", est: { add: 1 },   score: { lift_shift: 2 } },
      { id: "gym",       label: "Gym equipment",           est: { add: 1 },   score: { lift_shift: 2, assembly: 1 } },
      { id: "sofa",      label: "Large sofa or mattress",  est: { add: 0.5 }, score: { lift_shift: 1 } },
      { id: "piano",     label: "Piano",                   est: { add: 1.5 }, score: { lift_shift: 2 } },
      { id: "none",      label: "None of these", exclusive: true }
    ] },
  { id: "timing", type: "single", title: "When are you moving?",
    options: [
      { id: "week",  label: "This week" },
      { id: "month", label: "This month" },
      { id: "later", label: "Later than that" },
      { id: "unsure", label: "Not sure yet" }
    ] }
];

/* =========================================================
   APP
   ========================================================= */
(function(){
  var params = new URLSearchParams(location.search);
  var marketKey = CONFIG.markets[params.get("market")] ? params.get("market") : CONFIG.defaultMarket;
  var M = CONFIG.markets[marketKey];
  var C = CONFIG.copy;
  document.documentElement.lang = marketKey;

  var answers = {};   // questionId -> optionId (single) or [optionIds] (multi)
  var history = [];   // stack of question indexes shown
  var current = 0;
  var started = false;
  var app = document.getElementById("app");

  /* ---- parent page messaging ---- */
  function post(msg){
    msg.source = "tr-moving-calc";
    try { if (window.parent !== window) window.parent.postMessage(msg, "*"); } catch(e){}
  }
  function track(name, payload){ post({ type: "event", name: name, payload: payload || {} }); }
  function reportHeight(){ post({ type: "resize", height: Math.ceil(document.documentElement.scrollHeight) }); }
  if ("ResizeObserver" in window) new ResizeObserver(reportHeight).observe(document.body);
  window.addEventListener("load", reportHeight);

  /* ---- helpers ---- */
  function t(key, fallback){ return M.overrides[key] || fallback; }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function visible(){ return QUESTIONS.map(function(q,i){ return i; }).filter(function(i){ var q = QUESTIONS[i]; return !q.showIf || q.showIf(answers); }); }
  function nextIndex(from){ for (var i = from + 1; i < QUESTIONS.length; i++){ var q = QUESTIONS[i]; if (!q.showIf || q.showIf(answers)) return i; } return -1; }
  function opt(q, id){ return q.options.filter(function(o){ return o.id === id; })[0]; }
  function chosen(q){ var a = answers[q.id]; if (a == null) return []; return (Array.isArray(a) ? a : [a]).map(function(id){ return opt(q, id); }).filter(Boolean); }

  function link(catKey, slot){
    var cat = M.categories[catKey];
    var u = new URL(cat.path, M.base);
    Object.keys(CONFIG.utm).forEach(function(k){ u.searchParams.set(k, params.get(k) || CONFIG.utm[k]); });
    u.searchParams.set("utm_content", slot + "_" + catKey);
    return u.toString();
  }

  /* ---- progress ---- */
  function progressHTML(){
    var v = visible(), pos = v.indexOf(current), html = "";
    v.forEach(function(qi, n){
      var answered = answers[QUESTIONS[qi].id] != null && n < pos;
      html += '<span class="box' + (answered ? " packed" : "") + (n === pos ? " current" : "") + '" aria-hidden="true"></span>';
    });
    return '<div class="progress">' + html + '<span class="progress-label">Question ' + (pos + 1) + " of " + v.length + "</span></div>";
  }

  /* ---- question screen ---- */
  function renderQuestion(){
    var q = QUESTIONS[current];
    var multi = q.type === "multi";
    var sel = answers[q.id];
    var html = progressHTML();
    html += '<h2 class="q-title" tabindex="-1">' + esc(t(q.id, q.title)) + "</h2>";
    if (q.hint) html += '<p class="q-hint">' + esc(t(q.id + ".hint", q.hint)) + "</p>"; else html += '<p class="q-hint sr-only">Choose one.</p>';
    html += '<div class="options" role="group" aria-label="' + esc(t(q.id, q.title)) + '">';
    q.options.forEach(function(o){
      var on = multi ? (sel || []).indexOf(o.id) > -1 : sel === o.id;
      html += '<button type="button" class="opt' + (multi ? " multi" : "") + '" data-id="' + o.id + '" aria-pressed="' + on + '">' +
              '<span class="mark" aria-hidden="true"></span><span>' + esc(t(q.id + "." + o.id, o.label)) +
              (o.sub ? '<span class="sub">' + esc(t(q.id + "." + o.id + ".sub", o.sub)) + "</span>" : "") + "</span></button>";
    });
    html += "</div>";
    html += '<div class="nav">' +
      (history.length ? '<button type="button" class="btn btn-ghost" data-act="back">← ' + C.back + "</button>" : "<span></span>") +
      (multi ? '<button type="button" class="btn btn-primary" data-act="next"' + ((sel && sel.length) ? "" : " disabled") + ">" + C.next + "</button>" : "") +
      "</div>";
    app.innerHTML = html;
    var h = app.querySelector(".q-title");
    if (h && started) h.focus({ preventScroll: true });
    track("step_view", { step: q.id, market: marketKey });
  }

  function choose(id){
    var q = QUESTIONS[current];
    if (!started){ started = true; track("start", { market: marketKey }); }
    if (q.type === "single"){
      answers[q.id] = id;
      // Clear answers to questions that are now hidden
      QUESTIONS.forEach(function(qq){ if (qq.showIf && !qq.showIf(answers)) delete answers[qq.id]; });
      advance();
    } else {
      var o = opt(q, id), list = (answers[q.id] || []).slice();
      var i = list.indexOf(id);
      if (i > -1) list.splice(i, 1);
      else if (o.exclusive) list = [id];
      else { list = list.filter(function(x){ return !opt(q, x).exclusive; }); list.push(id); }
      answers[q.id] = list;
      renderQuestion();
      var btn = app.querySelector('[data-id="' + id + '"]'); if (btn) btn.focus();
    }
  }
  function advance(){
    var n = nextIndex(current);
    history.push(current);
    if (n === -1) renderResults(); else { current = n; renderQuestion(); }
    post({ type: "step" });
  }
  function back(){
    if (!history.length) return;
    current = history.pop();
    renderQuestion();
    post({ type: "step" });
  }

  /* ---- scoring + estimate ---- */
  function score(){
    var s = {};
    Object.keys(M.categories).forEach(function(k){ s[k] = 0; });
    QUESTIONS.forEach(function(q){ chosen(q).forEach(function(o){
      if (o.score) Object.keys(o.score).forEach(function(k){ s[k] = (s[k] || 0) + o.score[k]; });
    }); });
    return Object.keys(s).filter(function(k){ return s[k] > 0; }).sort(function(a,b){ return s[b] - s[a]; }).map(function(k){ return { key: k, pts: s[k] }; });
  }
  function range(h){
    var lo = Math.max(1, Math.round(h * 0.8)), hi = Math.max(lo + 1, Math.round(h * 1.25));
    return lo + "–" + hi + " hours";
  }
  function estimate(){
    var size = chosen(QUESTIONS[1])[0], access = chosen(QUESTIONS[4])[0];
    var heavy = chosen(QUESTIONS[5]), helpWith = answers.help_with || [];
    var mult = access && access.est ? access.est.mult : 1;
    var add = heavy.reduce(function(sum, o){ return sum + ((o.est && o.est.add) || 0); }, 0);
    var out = [];
    if (size){
      var taskers = size.est.taskers + (access && access.id === "stairs3" ? 1 : 0);
      out.push({ value: taskers + " Taskers", label: "for about " + range((size.est.hours * mult + add) * 2 / taskers) + " of loading and unloading" });
      if (helpWith.indexOf("packing") > -1 || answers.vehicle === "full"){
        out.push({ value: "2 Taskers", label: "for about " + range(size.est.pack / 2) + " of packing" });
      }
    } else {
      out.push({ value: "2 Taskers", label: "for about " + range((1.5 + add) * mult) });
    }
    return out;
  }

  /* ---- results screen ---- */
  function renderResults(){
    var ranked = score();
    if (!ranked.length) ranked = [{ key: "help_moving", pts: 1 }];
    var primary = ranked[0].key;
    var addons = ranked.slice(1).filter(function(r){ return r.pts >= 3; }).slice(0, 3);
    var P = M.categories[primary];
    var heavy = answers.specialty || [];
    var notes = [];
    if (answers.timing === "week") notes.push(C.noteSoon);
    if (answers.access === "stairs3") notes.push(C.noteStairs);
    if (heavy.indexOf("piano") > -1) notes.push(C.notePiano);

    var html = '<h2 class="q-title" tabindex="-1">' + C.resultsTitle + "</h2>";
    html += '<p class="r-intro">' + C.resultsIntro + "</p>";
    html += '<section class="match"><span class="match-tag">' + C.bestMatch + "</span><h3>" + esc(P.name) + "</h3><p>" + esc(P.blurb) + "</p>";
    html += '<ul class="estimates">' + estimate().map(function(e){ return '<li class="est"><strong>' + e.value + "</strong><span>" + e.label + "</span></li>"; }).join("") + "</ul>";
    html += '<a class="btn btn-primary" target="_top" rel="noopener" data-cat="' + primary + '" data-slot="primary" href="' + link(primary, "primary") + '">' + C.cta + "</a></section>";
    if (addons.length){
      html += '<section class="addons"><h4>' + C.addonsTitle + "</h4>";
      addons.forEach(function(r){ var c = M.categories[r.key];
        html += '<div class="addon"><div><b>' + esc(c.name) + "</b><small>" + esc(c.blurb) + '</small></div><a target="_top" rel="noopener" data-cat="' + r.key + '" data-slot="addon" href="' + link(r.key, "addon") + '">' + C.seeTaskers + "</a></div>";
      });
      html += "</section>";
    }
    if (notes.length) html += '<ul class="notes">' + notes.map(function(n){ return "<li>" + n + "</li>"; }).join("") + "</ul>";
    html += '<div class="nav"><button type="button" class="btn btn-ghost" data-act="back">← ' + C.back + '</button><button type="button" class="btn btn-ghost" data-act="restart">' + C.restart + "</button></div>";
    html += '<p class="fine">' + C.fine + "</p>";
    app.innerHTML = html;
    app.querySelector(".q-title").focus({ preventScroll: true });
    track("complete", { market: marketKey, primary: primary, addons: addons.map(function(a){ return a.key; }).join(","), answers: JSON.stringify(answers) });
  }

  /* ---- events ---- */
  app.addEventListener("click", function(e){
    var b = e.target.closest("button, a"); if (!b) return;
    if (b.dataset.id) return choose(b.dataset.id);
    if (b.dataset.act === "next") return advance();
    if (b.dataset.act === "back"){
      if (!app.querySelector(".opt")) { current = history.pop(); renderQuestion(); post({ type: "step" }); return; }
      return back();
    }
    if (b.dataset.act === "restart"){ answers = {}; history = []; current = 0; started = false; track("restart", { market: marketKey }); renderQuestion(); post({ type: "step" }); return; }
    if (b.dataset.cat) track("result_click", { market: marketKey, category: b.dataset.cat, slot: b.dataset.slot });
  });

  renderQuestion();
})();
</script>
</body>
</html>
