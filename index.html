<!DOCTYPE html>
<!-- Taskrabbit moving calculator v4: Start Over on every step + per-job task descriptions -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moving help calculator | Taskrabbit</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   THEME — Taskrabbit Brand Guidelines (Oct 2023)
   Primary: Agave, Monstera, Pampas, Lily. Secondary colours
   are used sparingly and never outweigh the primaries.
   Type: Inter. Letter spacing 0%. Line height 100–130%.
   ========================================================= */
:root{
  --agave:#0D7A5F;      /* primary brand green */
  --agave-dark:#0A644E; /* hover state, darker Agave */
  --monstera:#0A2B14;   /* text and dark surfaces */
  --pampas:#FFFCE4;     /* light surfaces, text on Agave */
  --lily:#FFFFFF;       /* page background */
  --teal:#65CCB2;       /* secondary, accents only */
  --ink-soft:rgba(10,43,20,.74);
  --line:rgba(10,43,20,.14);
  --radius-lg:20px;
  --radius-md:14px;
  --font:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box;letter-spacing:0}
html,body{margin:0;padding:0;background:transparent}
body{font-family:var(--font);font-weight:400;color:var(--monstera);font-size:16px;line-height:1.3;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{max-width:720px;margin:0 auto;padding:28px 24px 28px;background:var(--lily);border:1px solid var(--line);border-radius:var(--radius-lg)}

/* ---------- Progress: a row of boxes that get packed ---------- */
.progress{display:flex;gap:8px;align-items:flex-end;margin:0 0 24px}
.box{position:relative;flex:1;max-width:44px;height:30px;border:2px dashed rgba(13,122,95,.4);border-radius:5px;transition:background-color .25s ease,border-color .25s ease,transform .25s ease}
.box.packed{background:var(--agave);border:2px solid var(--agave);transform:translateY(-2px)}
.box.packed::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:8px;margin-left:-4px;background:var(--pampas)}
.box.current{border:2px solid var(--agave)}
.progress-label{margin-left:auto;font-size:14px;color:var(--ink-soft);white-space:nowrap;padding-left:8px}

/* ---------- Question ---------- */
.q-title{font-size:clamp(24px,4.4vw,30px);line-height:1.15;font-weight:700;margin:0 0 8px;outline:none}
.q-hint{color:var(--ink-soft);margin:0 0 20px;line-height:1.3}
.q-hint.sr-only + .options{margin-top:20px}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:60px;padding:14px 16px;background:var(--pampas);border:2px solid transparent;border-radius:var(--radius-md);cursor:pointer;font-weight:600;line-height:1.25;color:var(--monstera)}
.opt:hover{border-color:var(--agave)}
.opt[aria-pressed="true"]{background:var(--agave);border-color:var(--agave);color:var(--pampas)}
.opt .mark{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--agave);display:grid;place-items:center;background:var(--lily)}
.opt.multi .mark{border-radius:6px}
.opt[aria-pressed="true"] .mark{border-color:var(--pampas);background:var(--pampas)}
.opt[aria-pressed="true"] .mark::after{content:"";width:6px;height:10px;border:solid var(--agave);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.opt .sub{display:block;font-weight:400;font-size:14px;color:var(--ink-soft);margin-top:2px}
.opt[aria-pressed="true"] .sub{color:var(--pampas)}

/* ---------- Nav + buttons ---------- */
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:24px;min-height:48px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:999px;border:0;cursor:pointer;font-weight:700;text-decoration:none;line-height:1}
.btn-primary{background:var(--agave);color:var(--pampas)}
.btn-primary:hover{background:var(--agave-dark)}
.btn-primary:disabled{background:var(--line);color:var(--ink-soft);cursor:not-allowed}
.btn-light{background:var(--pampas);color:var(--monstera)}
.btn-light:hover{background:var(--lily)}
.btn-ghost{background:transparent;color:var(--agave);padding:0 6px}
.btn-ghost:hover{color:var(--monstera)}
:focus-visible{outline:3px solid var(--monstera);outline-offset:2px}

/* ---------- Results ---------- */
.r-intro{color:var(--ink-soft);margin:0 0 16px}
.match{position:relative;overflow:hidden;background:var(--agave);color:var(--pampas);border-radius:var(--radius-lg);padding:26px 24px 24px;margin-bottom:24px}
/* Secondary shape: a small dot grid, used once and sparingly */
.match::before{content:"";position:absolute;top:18px;right:18px;width:70px;height:42px;background-image:radial-gradient(circle,var(--pampas) 2.2px,transparent 2.7px);background-size:14px 14px;opacity:.6;pointer-events:none}
.match-tag{display:inline-block;font-size:14px;font-weight:600;color:var(--monstera);background:var(--teal);padding:4px 12px;border-radius:999px;margin-bottom:12px}
.match h3{font-size:clamp(26px,4.8vw,34px);line-height:1.1;margin:0 0 8px;font-weight:700;max-width:16ch}
.match p{margin:0 0 18px;max-width:56ch;line-height:1.3}
.estimates{display:grid;gap:8px;margin:0 0 20px;padding:0;list-style:none}
.est{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;padding:12px 14px;background:rgba(10,43,20,.28);border-radius:var(--radius-md)}
.est strong{font-size:20px;font-weight:700;white-space:nowrap}
.est span{font-size:15px;line-height:1.3}
.addons h4{font-size:19px;font-weight:600;margin:0 0 10px}
.addon{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.addon:last-child{border-bottom:1px solid var(--line)}
.addon b{display:block;font-weight:600}
.addon small{display:block;color:var(--ink-soft);font-size:14px;line-height:1.3;margin-top:2px}
.addon a{flex:none;font-weight:700;color:var(--agave);text-decoration:none;padding:10px 4px}
.addon a:hover{color:var(--monstera);text-decoration:underline}
.nav-left{display:flex;align-items:center;gap:4px}
.btn-quiet{color:var(--ink-soft)}
.btn-outline{background:transparent;color:var(--agave);border:2px solid var(--agave)}
.btn-outline:hover{background:var(--agave);color:var(--pampas)}
.btn-outline-light{background:transparent;color:var(--pampas);border:2px solid var(--pampas)}
.btn-outline-light:hover{background:var(--pampas);color:var(--monstera)}
.est{margin:0 0 18px}
.desc{margin:0 0 18px}
.match .desc{margin-bottom:0}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.desc label{display:block;font-weight:600;margin-bottom:8px}
.desc textarea{display:block;width:100%;min-height:104px;padding:12px 14px;border-radius:var(--radius-md);border:2px solid var(--line);background:var(--lily);color:var(--monstera);font:inherit;font-size:15px;line-height:1.3;resize:vertical}
.desc.on-dark textarea{border-color:transparent;background:var(--pampas)}
.desc-hint{font-size:14px;margin:8px 0 12px;color:var(--ink-soft)}
.desc.on-dark .desc-hint{color:var(--pampas);opacity:.9}
.addon{display:block}
.addon-row{display:flex;justify-content:space-between;align-items:center;gap:14px}
.addon details{margin-top:6px}
.addon summary{cursor:pointer;color:var(--agave);font-weight:600;font-size:15px;padding:6px 0;width:max-content}
.addon summary:hover{color:var(--monstera)}
.addon details[open] .desc{margin-top:10px;margin-bottom:6px}
.notes{margin:20px 0 0;padding:14px 16px;list-style:none;font-size:15px;background:var(--pampas);border-radius:var(--radius-md)}
.notes li+li{margin-top:8px}
.fine{font-size:13px;color:var(--ink-soft);margin:16px 0 0;line-height:1.3}

@media (max-width:480px){
  .app{padding:20px 16px 22px;border-radius:16px}
  .options{grid-template-columns:1fr}
  .addon-row{flex-direction:column;align-items:flex-start;gap:4px}
  .match::before{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<main class="app" id="app" aria-live="polite"></main>

<script>
/* =========================================================
   CONFIG — everything you'll want to edit lives here.
   ========================================================= */
var CONFIG = {
  version: "4",
  defaultMarket: "en-US",
  // Autofill: if the booking flow accepts a URL parameter for the task description,
  // put its name here (e.g. "description") and every Book a Tasker link will carry
  // that job's description. Leave empty until product/engineering confirm the name.
  prefillParam: "",
  // Default UTMs; any of these can be overridden from the iframe src,
  // e.g. ?utm_campaign=moving_guide_2026
  utm: { utm_source: "taskrabbit_blog", utm_medium: "embedded_tool", utm_campaign: "moving_calculator" },

  markets: {
    "en-US": {
      base: "https://www.taskrabbit.com",
      vehicle: "truck",
      // VERIFY every path before launch. Only /services/help-moving is confirmed.
      categories: {
        help_moving:    { name: "Help Moving",                path: "/services/help-moving",                blurb: "Taskers help load, carry, and unload. You provide the truck." },
        truck_assisted: { name: "Truck-Assisted Help Moving", path: "/services/truck-assisted-help-moving", blurb: "Book a Tasker with a truck to help with the heavy lifting." },
        full_service:   { name: "Full Service Help Moving",   path: "/services/full-service-help-moving",   blurb: "Help with every step: truck, packing, loading, and unloading." },
        lift_shift:     { name: "Heavy Lifting",              path: "/services/heavy-lifting",              blurb: "Extra hands for big, awkward items in or around your home." },
        packing:        { name: "Packing & Unpacking",        path: "/services/packing-services",           blurb: "Boxing up before the move, or settling in after." },
        assembly:       { name: "Furniture Assembly",         path: "/services/furniture-assembly",         blurb: "Help taking apart and rebuilding beds, desks, and shelves." },
        mounting:       { name: "TV Mounting",                path: "/services/tv-mounting",                blurb: "Get TVs, shelves, and art up on the walls at your new place." },
        cleaning:       { name: "Move-Out Cleaning",          path: "/services/cleaning",                   blurb: "Help getting your old place ready for the final walkthrough." },
        junk_removal:   { name: "Junk Removal",               path: "/services/junk-removal",               blurb: "Help clearing out anything that isn’t making the move." }
      },
      overrides: {}
    },
    "en-GB": {
      base: "https://www.taskrabbit.co.uk",
      vehicle: "van",
      categories: {
        help_moving:    { name: "Help Moving",         path: "/services/help-moving",          blurb: "Taskers help load, carry, and unload. You provide the van." },
        truck_assisted: { name: "Man with a Van",      path: "/services/man-with-a-van",       blurb: "Book a Tasker with a van to help with the heavy lifting." },
        full_service:   { name: "House Removals",      path: "/services/house-removals",       blurb: "Help with every step: van, packing, loading, and unloading." },
        lift_shift:     { name: "Heavy Lifting",       path: "/services/heavy-lifting",        blurb: "Extra hands for big, awkward items in or around your home." },
        packing:        { name: "Packing & Unpacking", path: "/services/packing-services",     blurb: "Boxing up before the move, or settling in after." },
        assembly:       { name: "Furniture Assembly",  path: "/services/furniture-assembly",   blurb: "Help taking apart and rebuilding beds, wardrobes, and shelves." },
        mounting:       { name: "TV Mounting",         path: "/services/tv-mounting",          blurb: "Get TVs, shelves, and pictures up on the walls at your new place." },
        cleaning:       { name: "End of Tenancy Cleaning", path: "/services/cleaning",         blurb: "Help getting your old place ready for the check-out inspection." },
        junk_removal:   { name: "Rubbish Removal",     path: "/services/rubbish-removal",      blurb: "Help clearing out anything that isn’t making the move." }
      },
      // Override any question/option text: "questionId" or "questionId.optionId"
      overrides: {
        "vehicle": "Do you have a van?",
        "vehicle.own": "Yes, I have a van",
        "vehicle.need": "No, I need one",
        "home_size.studio": "Studio or bedsit",
        "home_size.b1": "One-bedroom flat"
      }
    }
    // To add fr-FR / de-DE: copy the en-GB block, set base to the local domain,
    // and translate category names, blurbs and every question in overrides.
  },

  copy: {
    resultsTitle: "Here’s the help that fits your move",
    resultsIntro: "Based on your answers, start here:",
    bestMatch: "Best match",
    addonsTitle: "You’ll probably also want",
    cta: "Book a Tasker",
    seeTaskers: "Book a Tasker",
    restart: "Start Over",
    back: "Back",
    next: "Continue",
    fine: "Estimates are a rough guide, not a quote. Tasker rates and timings vary, and you’ll confirm the details with your Tasker when you book.",
    noteSoon: "Moving soon? Many Taskers offer same-day and next-day help.",
    notePiano: "Pianos are a special case. Mention yours when you book so you and your Tasker can check it’s a good fit.",
    noteStairs: "Lots of stairs? An extra pair of hands usually speeds things up.",
    resultsHow: "Most moves on Taskrabbit are booked with one Tasker. Book each job below separately, and paste in the description we’ve drafted so your Tasker knows what to expect.",
    oneTasker: "with one Tasker",
    descLabel: "Your task description",
    descHint: "Edit anything that’s not quite right, then paste it in when you book.",
    seeDesc: "See task description",
    copy: "Copy Description",
    copied: "Copied",
    noteLong: "That’s a long day for one person. You can book a second Tasker separately to split the work.",
    noteHeavy: "Heavy items like appliances or a piano can take two people. Consider booking a second Tasker for those."
  }
};

/* =========================================================
   QUESTIONS — score adds points to categories; est feeds the
   time estimate. showIf hides a question based on earlier answers.
   ========================================================= */
var QUESTIONS = [
  { id: "move_type", type: "single", title: "What are you moving?",
    options: [
      { id: "home",      label: "My whole home",                 score: { help_moving: 3 } },
      { id: "storage",   label: "Into or out of storage",        score: { help_moving: 3 } },
      { id: "few",       label: "A few big items",               sub: "Like a sofa, bed, or dresser", score: { lift_shift: 4, help_moving: 1 } },
      { id: "rearrange", label: "Things around my current home", score: { lift_shift: 6 } }
    ] },
  { id: "home_size", type: "single", title: "How big is the place?", hint: "For storage, pick the closest match to what’s going in or out.",
    showIf: function(a){ return a.move_type === "home" || a.move_type === "storage"; },
    options: [
      { id: "studio", label: "Studio",            est: { hours: 2.5, taskers: 2, pack: 2 } },
      { id: "b1",     label: "One bedroom",         est: { hours: 3.5, taskers: 2, pack: 3 } },
      { id: "b2",     label: "Two bedrooms",        est: { hours: 5,   taskers: 2, pack: 5 } },
      { id: "b3",     label: "Three bedrooms",        est: { hours: 6.5, taskers: 3, pack: 8 } },
      { id: "b4",     label: "Four or more bedrooms", est: { hours: 8,  taskers: 3, pack: 11 } }
    ] },
  { id: "vehicle", type: "single", title: "Do you have a truck or van?",
    showIf: function(a){ return a.move_type !== "rearrange"; },
    options: [
      { id: "own",  label: "Yes, I have one",                score: { help_moving: 4 } },
      { id: "need", label: "No, I need one",                 score: { truck_assisted: 7 } },
      { id: "full", label: "I want the whole move handled",  sub: "Vehicle, packing, and lifting", score: { full_service: 9 } }
    ] },
  { id: "help_with", type: "multi", title: "What else do you need help with?", hint: "Pick all that apply.",
    options: [
      { id: "packing",  label: "Packing or unpacking",              score: { packing: 5 } },
      { id: "assembly", label: "Taking apart or rebuilding furniture", score: { assembly: 5 } },
      { id: "mounting", label: "Mounting a TV or shelves",          score: { mounting: 5 } },
      { id: "cleaning", label: "Cleaning the place I’m leaving",    score: { cleaning: 5 } },
      { id: "junk",     label: "Getting rid of things",             score: { junk_removal: 5 } },
      { id: "none",     label: "Nothing else", exclusive: true }
    ] },
  { id: "access", type: "single", title: "How do you get in and out?", hint: "Think about the trickier of the two homes.",
    showIf: function(a){ return a.move_type !== "rearrange"; },
    options: [
      { id: "ground",   label: "Ground floor or driveway", est: { mult: 1 } },
      { id: "elevator", label: "Elevator",                 est: { mult: 1.1 } },
      { id: "stairs1",  label: "One or two flights of stairs",    est: { mult: 1.2 },  score: { lift_shift: 1 } },
      { id: "stairs3",  label: "Three or more flights",        est: { mult: 1.35 }, score: { lift_shift: 2 } }
    ] },
  { id: "specialty", type: "multi", title: "Anything especially heavy?", hint: "Pick all that apply. The treadmill-turned-coat-rack counts.",
    options: [
      { id: "appliance", label: "Washer, dryer, or fridge", est: { add: 1 },   score: { lift_shift: 2 } },
      { id: "gym",       label: "Gym equipment",           est: { add: 1 },   score: { lift_shift: 2, assembly: 1 } },
      { id: "sofa",      label: "Large sofa or mattress",  est: { add: 0.5 }, score: { lift_shift: 1 } },
      { id: "piano",     label: "Piano",                   est: { add: 1.5 }, score: { lift_shift: 2 } },
      { id: "none",      label: "None of these", exclusive: true }
    ] },
  { id: "timing", type: "single", title: "When are you moving?",
    options: [
      { id: "week",  label: "This week" },
      { id: "month", label: "This month" },
      { id: "later", label: "Later than that" },
      { id: "unsure", label: "Not sure yet" }
    ] }
];

/* =========================================================
   APP
   ========================================================= */
(function(){
  var params = new URLSearchParams(location.search);
  var marketKey = CONFIG.markets[params.get("market")] ? params.get("market") : CONFIG.defaultMarket;
  var M = CONFIG.markets[marketKey];
  var C = CONFIG.copy;
  document.documentElement.lang = marketKey;

  var answers = {};   // questionId -> optionId (single) or [optionIds] (multi)
  var history = [];   // stack of question indexes shown
  var current = 0;
  var started = false;
  var app = document.getElementById("app");

  /* ---- parent page messaging ---- */
  function post(msg){
    msg.source = "tr-moving-calc";
    try { if (window.parent !== window) window.parent.postMessage(msg, "*"); } catch(e){}
  }
  function track(name, payload){ post({ type: "event", name: name, payload: payload || {} }); }
  function reportHeight(){ post({ type: "resize", height: Math.ceil(document.documentElement.scrollHeight) }); }
  if ("ResizeObserver" in window) new ResizeObserver(reportHeight).observe(document.body);
  window.addEventListener("load", reportHeight);

  /* ---- helpers ---- */
  function t(key, fallback){ return M.overrides[key] || fallback; }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function visible(){ return QUESTIONS.map(function(q,i){ return i; }).filter(function(i){ var q = QUESTIONS[i]; return !q.showIf || q.showIf(answers); }); }
  function nextIndex(from){ for (var i = from + 1; i < QUESTIONS.length; i++){ var q = QUESTIONS[i]; if (!q.showIf || q.showIf(answers)) return i; } return -1; }
  function opt(q, id){ return q.options.filter(function(o){ return o.id === id; })[0]; }
  function chosen(q){ var a = answers[q.id]; if (a == null) return []; return (Array.isArray(a) ? a : [a]).map(function(id){ return opt(q, id); }).filter(Boolean); }

  function link(catKey, slot, text){
    var cat = M.categories[catKey];
    var u = new URL(cat.path, M.base);
    Object.keys(CONFIG.utm).forEach(function(k){ u.searchParams.set(k, params.get(k) || CONFIG.utm[k]); });
    u.searchParams.set("utm_content", slot + "_" + catKey);
    if (CONFIG.prefillParam && text) u.searchParams.set(CONFIG.prefillParam, text);
    return u.toString();
  }

  /* ---- progress ---- */
  function progressHTML(){
    var v = visible(), pos = v.indexOf(current), html = "";
    v.forEach(function(qi, n){
      var answered = answers[QUESTIONS[qi].id] != null && n < pos;
      html += '<span class="box' + (answered ? " packed" : "") + (n === pos ? " current" : "") + '" aria-hidden="true"></span>';
    });
    return '<div class="progress">' + html + '<span class="progress-label">Question ' + (pos + 1) + " of " + v.length + "</span></div>";
  }

  /* ---- question screen ---- */
  function renderQuestion(){
    var q = QUESTIONS[current];
    var multi = q.type === "multi";
    var sel = answers[q.id];
    var html = progressHTML();
    html += '<h2 class="q-title" tabindex="-1">' + esc(t(q.id, q.title)) + "</h2>";
    if (q.hint) html += '<p class="q-hint">' + esc(t(q.id + ".hint", q.hint)) + "</p>"; else html += '<p class="q-hint sr-only">Choose one.</p>';
    html += '<div class="options" role="group" aria-label="' + esc(t(q.id, q.title)) + '">';
    q.options.forEach(function(o){
      var on = multi ? (sel || []).indexOf(o.id) > -1 : sel === o.id;
      html += '<button type="button" class="opt' + (multi ? " multi" : "") + '" data-id="' + o.id + '" aria-pressed="' + on + '">' +
              '<span class="mark" aria-hidden="true"></span><span>' + esc(t(q.id + "." + o.id, o.label)) +
              (o.sub ? '<span class="sub">' + esc(t(q.id + "." + o.id + ".sub", o.sub)) + "</span>" : "") + "</span></button>";
    });
    html += "</div>";
    html += '<div class="nav">' +
      (history.length ? '<div class="nav-left"><button type="button" class="btn btn-ghost" data-act="back">← ' + C.back + '</button><button type="button" class="btn btn-ghost btn-quiet" data-act="restart">' + C.restart + "</button></div>" : "<span></span>") +
      (multi ? '<button type="button" class="btn btn-primary" data-act="next"' + ((sel && sel.length) ? "" : " disabled") + ">" + C.next + "</button>" : "") +
      "</div>";
    app.innerHTML = html;
    var h = app.querySelector(".q-title");
    if (h && started) h.focus({ preventScroll: true });
    track("step_view", { step: q.id, market: marketKey });
  }

  function choose(id){
    var q = QUESTIONS[current];
    if (!started){ started = true; track("start", { market: marketKey }); }
    if (q.type === "single"){
      answers[q.id] = id;
      // Clear answers to questions that are now hidden
      QUESTIONS.forEach(function(qq){ if (qq.showIf && !qq.showIf(answers)) delete answers[qq.id]; });
      advance();
    } else {
      var o = opt(q, id), list = (answers[q.id] || []).slice();
      var i = list.indexOf(id);
      if (i > -1) list.splice(i, 1);
      else if (o.exclusive) list = [id];
      else { list = list.filter(function(x){ return !opt(q, x).exclusive; }); list.push(id); }
      answers[q.id] = list;
      renderQuestion();
      var btn = app.querySelector('[data-id="' + id + '"]'); if (btn) btn.focus();
    }
  }
  function advance(){
    var n = nextIndex(current);
    history.push(current);
    if (n === -1) renderResults(); else { current = n; renderQuestion(); }
    post({ type: "step" });
  }
  function back(){
    if (!history.length) return;
    current = history.pop();
    renderQuestion();
    post({ type: "step" });
  }

  /* ---- scoring ---- */
  function score(){
    var s = {};
    Object.keys(M.categories).forEach(function(k){ s[k] = 0; });
    QUESTIONS.forEach(function(q){ chosen(q).forEach(function(o){
      if (o.score) Object.keys(o.score).forEach(function(k){ s[k] = (s[k] || 0) + o.score[k]; });
    }); });
    return Object.keys(s).filter(function(k){ return s[k] > 0; }).sort(function(a,b){ return s[b] - s[a]; }).map(function(k){ return { key: k, pts: s[k] }; });
  }

  /* ---- time estimates, always for ONE Tasker ---- */
  function range(h){
    var lo = Math.max(1, Math.round(h * 0.8)), hi = Math.max(lo + 1, Math.round(h * 1.25));
    return lo + "–" + hi + " hours";
  }
  function moveHours(){
    var size = chosen(QUESTIONS[1])[0], access = chosen(QUESTIONS[4])[0];
    var mult = access && access.est ? access.est.mult : 1;
    var add = chosen(QUESTIONS[5]).reduce(function(sum, o){ return sum + ((o.est && o.est.add) || 0); }, 0);
    // size.est.hours assumes two people; one Tasker takes roughly 1.7x as long
    return size ? size.est.hours * 1.7 * mult + add : (1.5 + add) * mult;
  }
  function packHours(){ var size = chosen(QUESTIONS[1])[0]; return size ? size.est.pack : 2; }
  function hoursFor(key){
    if (key === "full_service") return moveHours() + packHours();
    if (["help_moving","truck_assisted","lift_shift"].indexOf(key) > -1) return moveHours();
    if (key === "packing") return packHours();
    return null;
  }

  /* ---- pre-written task descriptions ---- */
  var SIZE_TEXT = { studio: "a studio", b1: "a one-bedroom home", b2: "a two-bedroom home", b3: "a three-bedroom home", b4: "a home with four or more bedrooms" };
  var ACCESS_TEXT = { ground: "ground floor or driveway", elevator: "elevator", stairs1: "one or two flights of stairs", stairs3: "three or more flights of stairs" };
  var HEAVY_TEXT = { appliance: "a washer, dryer, or fridge", gym: "gym equipment", sofa: "a large sofa or mattress", piano: "a piano" };
  var TIMING_TEXT = { week: "this week", month: "this month", later: "in the next few months", unsure: "date still to be confirmed" };
  function listJoin(a){ return a.length < 3 ? a.join(" and ") : a.slice(0, -1).join(", ") + ", and " + a[a.length - 1]; }

  function describe(key){
    var a = answers, V = M.vehicle || "truck", size = SIZE_TEXT[a.home_size];
    var moveCats = ["help_moving","truck_assisted","full_service","lift_shift"];
    var parts = [];
    if (moveCats.indexOf(key) > -1){
      if (a.move_type === "home") parts.push("I’m moving " + (size || "my home") + ".");
      if (a.move_type === "storage") parts.push("I’m moving " + (size ? "the contents of " + size : "my things") + " into or out of storage.");
    }
    var task = {
      help_moving:    a.vehicle === "own" ? "I have my own " + V + " and need help loading, carrying, and unloading." : "I need help loading, carrying, and unloading.",
      truck_assisted: "I need a Tasker with a " + V + " to help load, transport, and unload my things.",
      full_service:   "I’d like help with the whole move, including a " + V + ", packing, loading, and unloading.",
      lift_shift:     a.move_type === "rearrange" ? "I need help moving furniture around my current home." : a.move_type === "few" ? "I need help moving a few big items, like a sofa, bed, or dresser." : "I need an extra pair of hands for some heavy items.",
      packing:        "I need help packing" + (size ? " " + size : "") + " before my move.",
      assembly:       "I need help taking apart and putting back together furniture for my move.",
      mounting:       "I need help mounting a TV or shelves at my new place.",
      cleaning:       "I need a move-out clean" + (size ? " for " + size : "") + ".",
      junk_removal:   "I need help clearing out and hauling away things I’m not taking with me."
    }[key];
    parts.push(task);
    if (moveCats.indexOf(key) > -1){
      if (a.access) parts.push("Access: " + ACCESS_TEXT[a.access] + ".");
      var heavy = (a.specialty || []).filter(function(id){ return HEAVY_TEXT[id]; }).map(function(id){ return HEAVY_TEXT[id]; });
      if (heavy.length) parts.push("Heavy items include " + listJoin(heavy) + ".");
    }
    if (key === "lift_shift" && extraHands) parts[parts.indexOf(task)] = "I’m booking a separate Tasker for the main move, and need an extra pair of hands for the heaviest items.";
    var h = (key === "lift_shift" && extraHands) ? null : hoursFor(key);
    if (h) parts.push("I’m expecting this to take about " + range(h) + ".");
    if (a.timing) parts.push("Timing: " + TIMING_TEXT[a.timing] + ".");
    return parts.join(" ");
  }

  /* ---- results screen ---- */
  var descId = 0, extraHands = false;
  function descBlock(key, onDark, after){
    var id = "desc-" + (++descId);
    return '<div class="desc' + (onDark ? " on-dark" : "") + '"><label for="' + id + '">' + C.descLabel + "</label>" +
      '<textarea id="' + id + '" rows="4">' + esc(describe(key)) + "</textarea>" +
      '<p class="desc-hint">' + C.descHint + "</p>" + '<div class="actions">' +
      '<button type="button" class="btn ' + (onDark ? "btn-outline-light" : "btn-outline") + '" data-copy="' + id + '" data-cat="' + key + '">' + C.copy + "</button>" + (after || "") + "</div></div>";
  }

  function renderResults(){
    descId = 0;
    var ranked = score();
    if (!ranked.length) ranked = [{ key: "help_moving", pts: 1 }];
    var primary = ranked[0].key;
    var CORE = ["help_moving","truck_assisted","full_service"];
    var needsHands = (answers.specialty || []).some(function(id){ return id !== "none"; }) || answers.access === "stairs3";
    var addons = ranked.slice(1).filter(function(r){
      if (r.pts < 3) return false;
      if (CORE.indexOf(primary) > -1 && CORE.indexOf(r.key) > -1) return false;
      if (r.key === "lift_shift" && CORE.indexOf(primary) > -1 && !needsHands) return false;
      return true;
    }).slice(0, 5);
    extraHands = CORE.indexOf(primary) > -1;
    var P = M.categories[primary];
    var heavy = answers.specialty || [];
    var hrs = hoursFor(primary);
    var notes = [];
    if (hrs && hrs > 7) notes.push(C.noteLong);
    if (heavy.indexOf("appliance") > -1 || heavy.indexOf("piano") > -1) notes.push(C.noteHeavy);
    if (answers.timing === "week") notes.push(C.noteSoon);
    if (answers.access === "stairs3" && !(hrs && hrs > 7)) notes.push(C.noteStairs);
    if (heavy.indexOf("piano") > -1) notes.push(C.notePiano);

    var html = '<h2 class="q-title" tabindex="-1">' + C.resultsTitle + "</h2>";
    html += '<p class="r-intro">' + C.resultsHow + "</p>";
    html += '<section class="match"><span class="match-tag">' + C.bestMatch + "</span><h3>" + esc(P.name) + "</h3><p>" + esc(P.blurb) + "</p>";
    if (hrs) html += '<div class="est"><strong>About ' + range(hrs) + "</strong><span>" + C.oneTasker + "</span></div>";
    html += descBlock(primary, true, '<a class="btn btn-light" target="_top" rel="noopener" data-cat="' + primary + '" data-slot="primary" href="' + link(primary, "primary", describe(primary)) + '">' + C.cta + "</a>");
    html += "</section>";
    if (addons.length){
      html += '<section class="addons"><h4>' + C.addonsTitle + "</h4>";
      addons.forEach(function(r){
        var c = M.categories[r.key];
        html += '<div class="addon"><div class="addon-row"><div><b>' + esc(c.name) + "</b><small>" + esc(c.blurb) + '</small></div><a target="_top" rel="noopener" data-cat="' + r.key + '" data-slot="addon" href="' + link(r.key, "addon", describe(r.key)) + '">' + C.seeTaskers + "</a></div>" +
          "<details><summary>" + C.seeDesc + "</summary>" + descBlock(r.key, false) + "</details></div>";
      });
      html += "</section>";
    }
    if (notes.length) html += '<ul class="notes">' + notes.map(function(n){ return "<li>" + n + "</li>"; }).join("") + "</ul>";
    html += '<div class="nav"><button type="button" class="btn btn-ghost" data-act="back">← ' + C.back + '</button><button type="button" class="btn btn-primary" data-act="restart">' + C.restart + "</button></div>";
    html += '<p class="fine">' + C.fine + "</p>";
    app.innerHTML = html;
    app.querySelector(".q-title").focus({ preventScroll: true });
    track("complete", { market: marketKey, primary: primary, addons: addons.map(function(a){ return a.key; }).join(","), answers: JSON.stringify(answers) });
  }

  /* ---- copy to clipboard (works inside the iframe; falls back if blocked) ---- */
  function copyDesc(btn){
    var ta = document.getElementById(btn.dataset.copy); if (!ta) return;
    var label = btn.textContent;
    function done(){ btn.textContent = C.copied; setTimeout(function(){ btn.textContent = label; }, 1800); }
    function fallback(){ ta.focus(); ta.select(); try { document.execCommand("copy"); } catch(e){} done(); }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(ta.value).then(done, fallback); else fallback();
    track("copy_description", { market: marketKey, category: btn.dataset.cat });
  }

  /* ---- events ---- */
  app.addEventListener("click", function(e){
    var b = e.target.closest("button, a"); if (!b) return;
    if (b.dataset.id) return choose(b.dataset.id);
    if (b.dataset.act === "next") return advance();
    if (b.dataset.act === "back"){
      if (!app.querySelector(".opt")) { current = history.pop(); renderQuestion(); post({ type: "step" }); return; }
      return back();
    }
    if (b.dataset.act === "restart"){ answers = {}; history = []; current = 0; started = false; track("restart", { market: marketKey }); renderQuestion(); post({ type: "step" }); return; }
    if (b.dataset.copy) return copyDesc(b);
    if (b.dataset.cat) track("result_click", { market: marketKey, category: b.dataset.cat, slot: b.dataset.slot });
  });

  app.addEventListener("input", function(e){
    if (!CONFIG.prefillParam || e.target.tagName !== "TEXTAREA") return;
    var btn = app.querySelector('[data-copy="' + e.target.id + '"]'); if (!btn) return;
    var key = btn.dataset.cat;
    app.querySelectorAll('a[data-cat="' + key + '"]').forEach(function(a){ a.href = link(key, a.dataset.slot, e.target.value); });
  });
  if (window.console) console.log("Taskrabbit moving calculator v" + CONFIG.version);

  renderQuestion();
})();
</script>
</body>
</html>
