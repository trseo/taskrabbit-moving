<!--
  Taskrabbit moving calculator: blog embed
  1. Replace YOUR-HOST with wherever index.html is hosted.
  2. Set ?market= to en-US or en-GB. Optionally override utm_campaign.
  3. Paste everything below into the blog post (HTML / custom code block).
-->
<div style="max-width:720px;margin:32px auto;">
  <iframe
    id="tr-moving-calc"
    src="https://YOUR-HOST/moving-calculator/index.html?market=en-US&utm_campaign=moving_calculator_blog"
    title="Moving help calculator"
    loading="lazy"
    allow="clipboard-write"
    scrolling="no"
    style="display:block;width:100%;min-height:520px;border:0;overflow:hidden;">
  </iframe>
</div>
<script>
(function () {
  var frame = document.getElementById('tr-moving-calc');
  if (!frame) return;
  var origin = new URL(frame.src).origin;

  window.addEventListener('message', function (e) {
    if (e.origin !== origin) return;                    // only trust the calculator
    var d = e.data;
    if (!d || d.source !== 'tr-moving-calc') return;

    // Keep the iframe exactly as tall as its content (no inner scrollbars)
    if (d.type === 'resize' && d.height) {
      frame.style.height = d.height + 'px';
    }

    // On each new step, bring the top of the tool back into view if needed
    if (d.type === 'step') {
      var top = frame.getBoundingClientRect().top;
      if (top < 0) window.scrollBy({ top: top - 80, behavior: 'smooth' });
    }

    // Analytics: pushes moving_calc_start, moving_calc_step_view,
    // moving_calc_complete, moving_calc_result_click, moving_calc_copy_description,
    // moving_calc_restart
    if (d.type === 'event') {
      window.dataLayer = window.dataLayer || [];
      var evt = { event: 'moving_calc_' + d.name };
      for (var k in d.payload) evt['moving_calc_' + k] = d.payload[k];
      window.dataLayer.push(evt);
    }
  });
})();
</script>
